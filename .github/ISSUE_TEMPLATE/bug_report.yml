name: Bug report
description: Something in the panel does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post passwords, two-factor codes, `.ovpn` files, link addresses or session cookies.** For a security problem, use the [private report](https://github.com/MohZeh/Darban-WebPanel/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `darban-webpanel -version` and `sudo darban version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: "`journalctl -u darban-webpanel -n 50` and the relevant error. Remove addresses you do not want public."
      render: text
